{% extends 'base.html' %}
{% load humanize %}
{% block content %}

<style>
    .checkout-wrapper { padding: 130px 0 80px; }
    .checkout-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 32px;
        padding: 50px;
        max-width: 560px;
        margin: 0 auto;
        box-shadow: 0 34px 90px rgba(0,0,0,0.28);
        backdrop-filter: blur(14px);
    }
    .checkout-card h3 { text-align: center; margin-bottom: 35px; font-size: 2rem; }
    .checkout-list { list-style: none; padding: 0; margin-bottom: 25px; }
    .checkout-list li {
        display: flex; justify-content: space-between;
        padding: 16px 0;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        color: var(--text-muted);
    }
    .checkout-list li.total {
        font-weight: 800; color: var(--gold); font-size: 1.25rem;
        border-bottom: none; padding-top: 22px;
    }
    .secure-note {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.82rem;
        margin-top: 22px;
    }
</style>

<div class="container checkout-wrapper">
    <div class="checkout-card" data-aos="zoom-in">
        <h3>Order Summary</h3>
        <ul class="checkout-list">
            {% for item in cart %}
            <li><span>{{ item.car }}</span><span>${{ item.price|intcomma }}</span></li>
            {% endfor %}
            <li class="total"><span>Total</span><span>${{ cart.get_total_price|intcomma }}</span></li>
        </ul>
        <form method="post">
            {% csrf_token %}
            <button class="btn-luxora w-100"><i class="bi bi-shield-lock"></i> Continue to Secure Payment</button>
        </form>
        <p class="secure-note"><i class="bi bi-lock-fill"></i> 256-bit SSL encrypted transaction</p>
    </div>
</div>
{% endblock %}
