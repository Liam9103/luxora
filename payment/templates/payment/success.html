{% extends 'base.html' %}
{% load humanize %}
{% block content %}

<style>
    .success-wrapper { padding: 160px 0; text-align: center; }
    .success-icon {
        width: 110px; height: 110px;
        background: linear-gradient(135deg, #10B981, #059669);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 30px;
        box-shadow: 0 15px 45px rgba(16,185,129,0.4);
    }
    .success-icon i { font-size: 3rem; color: #fff; }
    .success-wrapper h2 { font-size: 2.2rem; margin-bottom: 15px; }
    .tracking-box {
        display: inline-block;
        background: var(--bg-card);
        border: 1px solid var(--border-glass);
        padding: 20px 40px;
        border-radius: 18px;
        margin: 25px 0;
    }
    .tracking-box .code { font-family: 'Poppins', monospace; font-size: 1.3rem; color: var(--gold); font-weight: 700; letter-spacing: 2px; }
</style>

<div class="container success-wrapper">
    <div data-aos="zoom-in">
        <div class="success-icon"><i class="bi bi-check-lg"></i></div>
        <h2>Payment Successful!</h2>
        <p style="color: var(--text-muted);">Thank you for your purchase. Your order has been confirmed.</p>
        <div class="tracking-box">
            <div style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 6px;">TRACKING CODE</div>
            <div class="code">{{ order.tracking_code }}</div>
        </div>
        <p>Amount Paid: <strong style="color: var(--gold);">${{ order.total_price|intcomma }}</strong></p>
        <a href="{% url 'accounts:profile' %}" class="btn-luxora mt-3">View My Orders</a>
    </div>
</div>
{% endblock %}
