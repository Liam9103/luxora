{% extends 'base.html' %}
{% load humanize %}
{% block content %}

<style>
    .success-wrapper { padding: 160px 0; text-align: center; }
    .success-icon {
        width: 110px; height: 110px;
        background: linear-gradient(135deg, var(--gold-light), var(--gold));
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 30px;
        box-shadow: 0 18px 55px rgba(212,175,55,0.32);
    }
    .success-icon i { font-size: 3rem; color: #06060A; }
    .success-wrapper h2 { font-size: clamp(2rem, 3vw, 2.4rem); margin-bottom: 15px; }
    .success-note { color: var(--text-muted); }
    .tracking-label { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 6px; display: block; }
    .tracking-amount { color: var(--gold); }
    .tracking-box {
        display: inline-block;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        padding: 22px 42px;
        border-radius: 20px;
        margin: 25px 0;
        box-shadow: 0 30px 70px rgba(0,0,0,0.22);
    }
    .tracking-box .code { font-family: 'Poppins', monospace; font-size: 1.4rem; color: var(--gold); font-weight: 700; letter-spacing: 2px; }
</style>

<div class="container success-wrapper">
    <div data-aos="zoom-in">
        <div class="success-icon"><i class="bi bi-check-lg"></i></div>
        <h2>Payment Successful!</h2>
        <p class="success-note">Thank you for your purchase. Your order has been confirmed.</p>
        <div class="tracking-box">
            <div class="tracking-label">TRACKING CODE</div>
            <div class="code">{{ order.tracking_code }}</div>
        </div>
        <p>Amount Paid: <strong class="tracking-amount">${{ order.total_price|intcomma }}</strong></p>
        <a href="{% url 'accounts:profile' %}" class="btn-luxora mt-3">View My Orders</a>
    </div>
</div>
{% endblock %}
