{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-2">Your Wishlist</h1>
            <p class="text-muted">Save the cars you love and pick them up later.</p>
        </div>
        <a href="{% url 'cars:gallery' %}" class="btn-luxora-outline">Browse More</a>
    </div>

    {% if items %}
    <div class="row g-4">
        {% for item in items %}
        <div class="col-md-4">
            {% include 'cars/_car_card.html' with car=item.car %}
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="text-center py-5">
        <p class="text-muted">No cars in your wishlist yet.</p>
    </div>
    {% endif %}
</div>
{% endblock %}
